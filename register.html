<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <title>Nova Store - Registro</title>
</head>

<body>
    <a class="saltar-contenido" href="#contenido-principal">Ir al contenido</a>
    <header>
        <a href="index.html"><img class="logo" src="img/nova-store-logo.png" alt="Nova Store - Home"></a>
        <nav aria-label="Navegación principal">
            <a href="index.html">Home</a>
            <a class="enlace-login" href="login.html">Login</a>
            <a class="enlace-registro" href="register.html">Registro</a>
            <span class="saludo" hidden></span>
            <a class="enlace-logout" href="index.html" hidden>Logout</a>
        </nav>
        <form class="formulario-busqueda" action="search-results.html" method="get" novalidate>
            <label for="buscador">Buscar productos:</label>
            <div class="campo-busqueda">
                <input type="search" id="buscador" name="busqueda" placeholder="Ej: laptop" aria-describedby="error-busqueda">
                <button type="submit">Buscar</button>
            </div>
            <p class="error" id="error-busqueda" role="alert"></p>
        </form>
    </header>
    <div class="contenido">
        <nav class="categorias" aria-label="Categorías de productos">
            <h2>Categorías</h2>
            <p class="estado-categorias" role="status">Cargando categorías…</p>
            <ul class="lista-categorias"></ul>
        </nav>
        <main id="contenido-principal" class="principal-cuenta">
            <section class="cuenta" aria-labelledby="titulo-cuenta">
                <h1 id="titulo-cuenta">Crear una cuenta</h1>
                <form id="formulario-registro" action="login.html" method="post" novalidate>
                    <p>
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" autocomplete="email" required aria-describedby="error-email">
                        <span class="error" id="error-email" role="alert"></span>
                    </p>
                    <p>
                        <label for="contrasena">Contraseña:</label>
                        <input type="password" id="contrasena" name="contrasena" autocomplete="new-password" minlength="6" required aria-describedby="error-contrasena">
                        <span class="error" id="error-contrasena" role="alert"></span>
                    </p>
                    <p>
                        <label for="repetir-contrasena">Repetir contraseña:</label>
                        <input type="password" id="repetir-contrasena" name="repetir-contrasena" autocomplete="new-password" required aria-describedby="error-repetir">
                        <span class="error" id="error-repetir" role="alert"></span>
                    </p>
                    <p class="campo-terminos">
                        <input type="checkbox" id="terminos" name="terminos" required aria-describedby="error-terminos">
                        <label for="terminos">Acepto términos y condiciones</label>
                    </p>
                    <p class="error" id="error-terminos" role="alert"></p>
                    <button type="submit">Registrarme</button>
                </form>
                <p><a href="login.html">Ya tengo una cuenta</a></p>
            </section>
        </main>
    </div>
    <footer>
        <p>Integrantes: Fausto Beloqui, Francesco Scazzuso y Mateo Posse</p>
    </footer>
    <noscript><p class="aviso-sin-js">Activá JavaScript para cargar los productos y usar los formularios.</p></noscript>
    <script src="js/comun.js"></script>
    <script src="js/saludo.js"></script>
    <script src="js/logout.js"></script>
    <script src="js/register.js"></script>
</body>

</html>
